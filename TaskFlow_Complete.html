<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Complete Project</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3248;
      --text: #e8eaf0; --muted: #7b82a0; --accent: #6c63ff; --accent-light: #8b85ff;
      --accent-dim: rgba(108,99,255,0.15); --green: #22c55e; --green-dim: rgba(34,197,94,0.15);
      --yellow: #f59e0b; --yellow-dim: rgba(245,158,11,0.15); --red: #ef4444;
      --red-dim: rgba(239,68,68,0.15); --blue: #3b82f6; --blue-dim: rgba(59,130,246,0.15);
    }
    body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* ── DOWNLOAD BANNER ── */
    #dl-banner {
      background: linear-gradient(90deg, #6c63ff, #22c55e);
      padding: 0.6rem 1.5rem; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    #dl-banner span { font-size: 0.85rem; font-weight: 600; color: white; }
    .dl-btn {
      background: white; color: #6c63ff; border: none; padding: 0.4rem 1.1rem;
      border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 0.4rem; transition: transform 0.15s;
    }
    .dl-btn:hover { transform: scale(1.04); }

    /* ── AUTH ── */
    #auth-screen {
      min-height: calc(100vh - 40px); display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 60% 20%, rgba(108,99,255,0.18) 0%, transparent 60%),
                  radial-gradient(ellipse at 10% 80%, rgba(34,197,94,0.1) 0%, transparent 50%), var(--bg);
      padding: 1.5rem;
    }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); }
    .auth-logo { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem; }
    .auth-logo span { color: var(--accent); }
    .auth-tagline { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }
    .tab-row { display: flex; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 1.75rem; }
    .tab-btn { flex: 1; padding: 0.55rem; border: none; background: transparent; color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.875rem; font-weight: 600; border-radius: 7px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: white; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 0.4rem; }
    .field input { width: 100%; padding: 0.7rem 1rem; background: var(--bg); border: 1.5px solid var(--border); border-radius: 9px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .field input:focus { border-color: var(--accent); }
    .auth-submit { width: 100%; padding: 0.8rem; background: var(--accent); color: white; border: none; border-radius: 9px; font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s, transform 0.15s; }
    .auth-submit:hover { background: var(--accent-light); transform: translateY(-1px); }

    /* ── APP SHELL ── */
    #app-screen { display: none; min-height: 100vh; }
    .sidebar { position: fixed; left: 0; top: 40px; bottom: 0; width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 50; transition: transform 0.3s; }
    .sidebar-logo { padding: 1.5rem 1.25rem 1rem; font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid var(--border); }
    .sidebar-logo span { color: var(--accent); }
    .sidebar-user { padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-dim); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.875rem; color: var(--accent); flex-shrink: 0; }
    .user-name { font-weight: 600; font-size: 0.875rem; }
    .user-role { font-size: 0.75rem; color: var(--muted); }
    .nav-section { padding: 1rem 0.75rem 0.5rem; }
    .nav-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); padding: 0 0.5rem; margin-bottom: 0.5rem; }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 0.875rem; font-weight: 500; transition: all 0.15s; margin-bottom: 2px; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); }
    .nav-item .icon { font-size: 1rem; width: 20px; text-align: center; }
    .nav-badge { margin-left: auto; background: var(--accent); color: white; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding: 1rem 0.75rem; border-top: 1px solid var(--border); }
    .logout-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 0.875rem; font-weight: 500; transition: all 0.15s; width: 100%; background: none; border: none; font-family: 'Space Grotesk', sans-serif; }
    .logout-btn:hover { background: var(--red-dim); color: var(--red); }
    .main { margin-left: 240px; min-height: 100vh; }
    .topbar { padding: 1.25rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); position: sticky; top: 40px; z-index: 40; }
    .page-title { font-size: 1.4rem; font-weight: 700; }
    .topbar-actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn { padding: 0.55rem 1.1rem; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; display: flex; align-items: center; gap: 0.4rem; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .content { padding: 2rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .stat-card.purple::before { background: var(--accent); }
    .stat-card.green::before { background: var(--green); }
    .stat-card.yellow::before { background: var(--yellow); }
    .stat-card.red::before { background: var(--red); }
    .stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
    .stat-value { font-size: 2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .stat-card.purple .stat-value { color: var(--accent-light); }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.yellow .stat-value { color: var(--yellow); }
    .stat-card.red .stat-value { color: var(--red); }
    .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
    .filter-chip { padding: 0.4rem 0.9rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: transparent; color: var(--muted); font-family: 'Space Grotesk', sans-serif; transition: all 0.15s; }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: white; }
    .filter-chip:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .search-box { margin-left: auto; padding: 0.4rem 0.9rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 0.8rem; outline: none; width: 200px; transition: border-color 0.2s; }
    .search-box:focus { border-color: var(--accent); }
    .view-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .view-btn { padding: 0.35rem 0.75rem; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 0.9rem; transition: all 0.15s; }
    .view-btn.active { background: var(--accent); color: white; }
    .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    .kanban-col { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; min-height: 300px; }
    .col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .col-title { font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    .col-dot { width: 8px; height: 8px; border-radius: 50%; }
    .col-count { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 10px; }
    .task-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; cursor: pointer; transition: border-color 0.2s, transform 0.15s; position: relative; }
    .task-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .task-priority { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 4px; margin-bottom: 0.6rem; }
    .priority-high { background: var(--red-dim); color: var(--red); }
    .priority-medium { background: var(--yellow-dim); color: var(--yellow); }
    .priority-low { background: var(--green-dim); color: var(--green); }
    .task-title { font-weight: 600; font-size: 0.9rem; line-height: 1.4; margin-bottom: 0.5rem; }
    .task-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-bottom: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .task-footer { display: flex; align-items: center; justify-content: space-between; }
    .task-due { font-size: 0.75rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .task-due.overdue { color: var(--red); }
    .task-due.soon { color: var(--yellow); }
    .task-actions { display: flex; gap: 0.4rem; opacity: 0; transition: opacity 0.15s; }
    .task-card:hover .task-actions { opacity: 1; }
    .action-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); width: 26px; height: 26px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.delete:hover { border-color: var(--red); color: var(--red); }
    .task-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .task-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: border-color 0.2s; }
    .task-row:hover { border-color: var(--accent); }
    .task-row-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .task-row-check.done { background: var(--green); border-color: var(--green); }
    .task-row-title { flex: 1; font-weight: 600; font-size: 0.9rem; }
    .task-row-title.done { text-decoration: line-through; color: var(--muted); }
    .status-badge { font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
    .status-todo { background: var(--blue-dim); color: var(--blue); }
    .status-inprogress { background: var(--yellow-dim); color: var(--yellow); }
    .status-done { background: var(--green-dim); color: var(--green); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1.5rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; width: 100%; max-width: 520px; transform: scale(0.95); transition: transform 0.2s; max-height: 90vh; overflow-y: auto; }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; line-height: 1; transition: color 0.15s; }
    .close-btn:hover { color: var(--text); }
    .modal .field select { width: 100%; padding: 0.7rem 1rem; background: var(--bg); border: 1.5px solid var(--border); border-radius: 9px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; outline: none; appearance: none; transition: border-color 0.2s; }
    .modal .field select:focus { border-color: var(--accent); }
    .modal .field textarea { width: 100%; padding: 0.7rem 1rem; background: var(--bg); border: 1.5px solid var(--border); border-radius: 9px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; outline: none; resize: vertical; min-height: 90px; transition: border-color 0.2s; }
    .modal .field textarea:focus { border-color: var(--accent); }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.75rem 1.25rem; border-radius: 10px; font-size: 0.875rem; font-weight: 500; z-index: 200; transform: translateY(80px); opacity: 0; transition: all 0.3s; display: flex; align-items: center; gap: 0.5rem; }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { background: var(--green); color: white; }
    #toast.error { background: var(--red); color: white; }
    #toast.info { background: var(--accent); color: white; }
    .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; padding: 0.25rem; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .empty-state h3 { color: var(--text); margin-bottom: 0.5rem; }
    .progress-wrap { margin-bottom: 2rem; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    .progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 3px; transition: width 0.5s ease; }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .kanban { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      .sidebar { transform: translateX(-100%); top: 80px; }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main { margin-left: 0; }
      .menu-toggle { display: block; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .content { padding: 1rem; }
      .topbar { padding: 1rem; }
      .search-box { width: 130px; }
      #dl-banner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<!-- ══ DOWNLOAD BANNER ══ -->
<div id="dl-banner">
  <span>⬇️ TaskFlow Complete Project &nbsp;|&nbsp; Frontend (this file) + Django Backend included</span>
  <button class="dl-btn" onclick="downloadBackend()">📦 Download Django Backend</button>
</div>

<!-- ══ AUTH SCREEN ══ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">Task<span>Flow</span></div>
    <div class="auth-tagline">Manage your work, beautifully.</div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>
    <div id="auth-fields"></div>
    <button class="auth-submit" onclick="handleAuth()">Continue →</button>
  </div>
</div>

<!-- ══ APP SCREEN ══ -->
<div id="app-screen">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Task<span>Flow</span></div>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">?</div>
      <div>
        <div class="user-name" id="sidebar-name">User</div>
        <div class="user-role">Team Member</div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Workspace</div>
      <div class="nav-item active" id="nav-dashboard" onclick="showView('dashboard')"><span class="icon">📊</span> Dashboard</div>
      <div class="nav-item" id="nav-tasks" onclick="showView('tasks')"><span class="icon">✅</span> My Tasks <span class="nav-badge" id="badge-tasks">0</span></div>
      <div class="nav-item" id="nav-inprogress" onclick="showView('inprogress')"><span class="icon">⚡</span> In Progress <span class="nav-badge" id="badge-inprogress" style="background:var(--yellow)">0</span></div>
      <div class="nav-item" id="nav-completed" onclick="showView('completed')"><span class="icon">🎯</span> Completed</div>
    </div>
    <div class="sidebar-bottom">
      <button class="logout-btn" onclick="doLogout()"><span class="icon">🚪</span> Sign Out</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:1rem">
        <button class="menu-toggle" onclick="openSidebar()">☰</button>
        <div class="page-title" id="page-title">Dashboard</div>
      </div>
      <div class="topbar-actions">
        <div class="view-toggle" id="view-toggle" style="display:none">
          <button class="view-btn active" id="vbtn-kanban" onclick="setView('kanban')" title="Kanban">⊞</button>
          <button class="view-btn" id="vbtn-list" onclick="setView('list')" title="List">☰</button>
        </div>
        <button class="btn btn-primary" onclick="openNewTask()">＋ New Task</button>
      </div>
    </div>
    <div class="content">
      <div id="view-dashboard">
        <div class="stats-grid" id="stats-grid"></div>
        <div class="progress-wrap">
          <div class="progress-label"><span>Overall Progress</span><span id="progress-pct">0%</span></div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
        <div style="font-size:0.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem">Recent Tasks</div>
        <div id="recent-tasks"></div>
      </div>
      <div id="view-tasks" style="display:none">
        <div class="filter-bar" id="filter-bar">
          <button class="filter-chip active" onclick="setFilter('all',this)">All</button>
          <button class="filter-chip" onclick="setFilter('high',this)">🔴 High</button>
          <button class="filter-chip" onclick="setFilter('medium',this)">🟡 Medium</button>
          <button class="filter-chip" onclick="setFilter('low',this)">🟢 Low</button>
          <input class="search-box" placeholder="🔍 Search tasks…" oninput="setSearch(this.value)"/>
        </div>
        <div id="kanban-board"></div>
        <div id="list-board" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ TASK MODAL ══ -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">New Task</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="field"><label>Title *</label><input id="t-title" placeholder="What needs to be done?"/></div>
    <div class="field"><label>Description</label><textarea id="t-desc" placeholder="Add details…"></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
      <div class="field"><label>Priority</label>
        <select id="t-priority"><option value="high">🔴 High</option><option value="medium" selected>🟡 Medium</option><option value="low">🟢 Low</option></select>
      </div>
      <div class="field"><label>Status</label>
        <select id="t-status"><option value="todo">To Do</option><option value="inprogress">In Progress</option><option value="done">Done</option></select>
      </div>
    </div>
    <div class="field"><label>Due Date</label><input id="t-due" type="date"/></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

// ── DOWNLOAD BACKEND ──
function downloadBackend() {
  // We'll create individual files as a text bundle since JSZip isn't available inline
  // Instead create a self-extracting HTML that shows all files
  let content = '# TaskFlow Django Backend — All Files\n';
  content += '# Copy each file into the correct folder\n\n';
  for (const [path, code] of Object.entries(BACKEND_FILES)) {
    content += `\n${'='.repeat(60)}\n# FILE: ${path}\n${'='.repeat(60)}\n${code}\n`;
  }
  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'taskflow_backend_all_files.txt';
  a.click();
  showToast('Backend files downloaded! ✓', 'success');
}

let currentUser = JSON.parse(localStorage.getItem('tf_user') || 'null');
let tasks = JSON.parse(localStorage.getItem('tf_tasks') || '[]');
let editingId = null, activeFilter = 'all', searchQuery = '', boardView = 'kanban', authMode = 'login', currentNav = 'dashboard';

function switchTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  renderAuthFields();
}

function renderAuthFields() {
  document.getElementById('auth-fields').innerHTML = authMode === 'login' ? `
    <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="you@example.com"/></div>
    <div class="field"><label>Password</label><input id="a-pass" type="password" placeholder="••••••••"/></div>
  ` : `
    <div class="field"><label>Full Name</label><input id="a-name" placeholder="Jane Smith"/></div>
    <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="you@example.com"/></div>
    <div class="field"><label>Password</label><input id="a-pass" type="password" placeholder="Create a password"/></div>
  `;
}

function handleAuth() {
  const email = document.getElementById('a-email')?.value.trim();
  const pass = document.getElementById('a-pass')?.value;
  if (!email || !pass) { showToast('Fill all fields', 'error'); return; }
  const users = JSON.parse(localStorage.getItem('tf_users') || '[]');
  if (authMode === 'login') {
    const user = users.find(u => u.email === email && u.pass === pass);
    if (!user) { showToast('Wrong email or password', 'error'); return; }
    loginUser(user);
  } else {
    const name = document.getElementById('a-name')?.value.trim();
    if (!name) { showToast('Enter your name', 'error'); return; }
    if (users.find(u => u.email === email)) { showToast('Email already used', 'error'); return; }
    const user = { id: Date.now(), name, email, pass };
    users.push(user); localStorage.setItem('tf_users', JSON.stringify(users));
    loginUser(user);
  }
}

function loginUser(user) {
  currentUser = user; localStorage.setItem('tf_user', JSON.stringify(user));
  loadUserTasks();
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('sidebar-name').textContent = user.name.split(' ')[0];
  document.getElementById('user-avatar').textContent = user.name[0].toUpperCase();
  showView('dashboard');
  showToast(`Welcome, ${user.name.split(' ')[0]}! 👋`, 'success');
  if (tasks.length === 0) addSampleTasks();
}

function doLogout() {
  currentUser = null; localStorage.removeItem('tf_user');
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  renderAuthFields(); showToast('Signed out', 'info');
}

function loadUserTasks() {
  tasks = JSON.parse(localStorage.getItem('tf_tasks') || '[]').filter(t => t.userId === currentUser.id);
}

function saveTasks() {
  const others = JSON.parse(localStorage.getItem('tf_tasks') || '[]').filter(t => t.userId !== currentUser.id);
  localStorage.setItem('tf_tasks', JSON.stringify([...others, ...tasks]));
  updateBadges();
}

function showView(name) {
  currentNav = name; closeSidebar();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + name)?.classList.add('active');
  document.getElementById('page-title').textContent = { dashboard:'Dashboard', tasks:'My Tasks', inprogress:'In Progress', completed:'Completed' }[name];
  document.getElementById('view-dashboard').style.display = 'none';
  document.getElementById('view-tasks').style.display = 'none';
  document.getElementById('view-toggle').style.display = 'none';
  if (name === 'dashboard') { document.getElementById('view-dashboard').style.display = 'block'; renderDashboard(); }
  else { document.getElementById('view-tasks').style.display = 'block'; document.getElementById('view-toggle').style.display = 'flex'; renderTasksView(name); }
}

function renderDashboard() {
  const total=tasks.length, done=tasks.filter(t=>t.status==='done').length,
        inprog=tasks.filter(t=>t.status==='inprogress').length,
        overdue=tasks.filter(t=>t.due&&new Date(t.due)<new Date()&&t.status!=='done').length;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card purple"><div class="stat-label">Total Tasks</div><div class="stat-value">${total}</div></div>
    <div class="stat-card green"><div class="stat-label">Completed</div><div class="stat-value">${done}</div></div>
    <div class="stat-card yellow"><div class="stat-label">In Progress</div><div class="stat-value">${inprog}</div></div>
    <div class="stat-card red"><div class="stat-label">Overdue</div><div class="stat-value">${overdue}</div></div>`;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progress-pct').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
  const recent = [...tasks].sort((a,b)=>b.id-a.id).slice(0,5);
  document.getElementById('recent-tasks').innerHTML = recent.length
    ? `<div class="task-list">${recent.map(taskRowHTML).join('')}</div>`
    : `<div class="empty-state"><div class="icon">📋</div><h3>No tasks yet</h3><p>Create your first task!</p></div>`;
}

function renderTasksView(nav) {
  let f = [...tasks];
  if (nav==='inprogress') f=f.filter(t=>t.status==='inprogress');
  if (nav==='completed') f=f.filter(t=>t.status==='done');
  if (activeFilter!=='all') f=f.filter(t=>t.priority===activeFilter);
  if (searchQuery) f=f.filter(t=>t.title.toLowerCase().includes(searchQuery)||(t.desc||'').toLowerCase().includes(searchQuery));
  boardView==='kanban' ? renderKanban(f) : renderList(f);
}

function renderKanban(filtered) {
  document.getElementById('kanban-board').style.display='grid';
  document.getElementById('list-board').style.display='none';
  document.getElementById('kanban-board').innerHTML = [
    {key:'todo',label:'To Do',color:'#3b82f6'},
    {key:'inprogress',label:'In Progress',color:'#f59e0b'},
    {key:'done',label:'Done',color:'#22c55e'}
  ].map(col => {
    const ct = filtered.filter(t=>t.status===col.key);
    return `<div class="kanban-col">
      <div class="col-header"><div class="col-title"><div class="col-dot" style="background:${col.color}"></div>${col.label}</div><div class="col-count">${ct.length}</div></div>
      ${ct.length ? ct.map(taskCardHTML).join('') : '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:1.5rem 0">No tasks here</div>'}
    </div>`;
  }).join('');
}

function renderList(filtered) {
  document.getElementById('kanban-board').style.display='none';
  document.getElementById('list-board').style.display='block';
  document.getElementById('list-board').innerHTML = filtered.length
    ? `<div class="task-list">${filtered.map(taskRowHTML).join('')}</div>`
    : `<div class="empty-state"><div class="icon">🔍</div><h3>No tasks found</h3></div>`;
}

function taskCardHTML(t) {
  const d=dueMeta(t.due);
  return `<div class="task-card" onclick="openEditTask(${t.id})">
    <div class="task-priority priority-${t.priority}">${t.priority.toUpperCase()}</div>
    <div class="task-title">${escHtml(t.title)}</div>
    ${t.desc?`<div class="task-desc">${escHtml(t.desc)}</div>`:''}
    <div class="task-footer">
      <div class="task-due ${d.cls}">${d.text}</div>
      <div class="task-actions">
        <button class="action-btn" onclick="event.stopPropagation();cycleStatus(${t.id})">↻</button>
        <button class="action-btn delete" onclick="event.stopPropagation();deleteTask(${t.id})">🗑</button>
      </div>
    </div>
  </div>`;
}

function taskRowHTML(t) {
  return `<div class="task-row" onclick="openEditTask(${t.id})">
    <div class="task-row-check ${t.status==='done'?'done':''}" onclick="event.stopPropagation();toggleDone(${t.id})">${t.status==='done'?'✓':''}</div>
    <div class="task-row-title ${t.status==='done'?'done':''}">${escHtml(t.title)}</div>
    <div class="task-priority priority-${t.priority}" style="margin:0">${t.priority}</div>
    <div class="status-badge status-${t.status}">${t.status==='inprogress'?'In Progress':t.status==='done'?'Done':'To Do'}</div>
    <button class="action-btn delete" onclick="event.stopPropagation();deleteTask(${t.id})">🗑</button>
  </div>`;
}

function dueMeta(due) {
  if (!due) return {text:'No due date',cls:''};
  const d=new Date(due), now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((d-now)/86400000);
  if (diff<0) return {text:`${Math.abs(diff)}d overdue`,cls:'overdue'};
  if (diff===0) return {text:'Due today',cls:'soon'};
  if (diff<=2) return {text:`Due in ${diff}d`,cls:'soon'};
  return {text:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),cls:''};
}

function openNewTask() {
  editingId=null;
  ['t-title','t-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('t-priority').value='medium';
  document.getElementById('t-status').value='todo';
  document.getElementById('t-due').value='';
  document.getElementById('modal-title').textContent='New Task';
  document.getElementById('task-modal').classList.add('open');
}

function openEditTask(id) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  editingId=id;
  document.getElementById('modal-title').textContent='Edit Task';
  document.getElementById('t-title').value=t.title;
  document.getElementById('t-desc').value=t.desc||'';
  document.getElementById('t-priority').value=t.priority;
  document.getElementById('t-status').value=t.status;
  document.getElementById('t-due').value=t.due||'';
  document.getElementById('task-modal').classList.add('open');
}

function closeModal() { document.getElementById('task-modal').classList.remove('open'); }

function saveTask() {
  const title=document.getElementById('t-title').value.trim();
  if (!title) { showToast('Task title is required','error'); return; }
  const data = { title, desc:document.getElementById('t-desc').value.trim(), priority:document.getElementById('t-priority').value, status:document.getElementById('t-status').value, due:document.getElementById('t-due').value };
  if (editingId) { Object.assign(tasks.find(t=>t.id===editingId), data); showToast('Task updated ✓','success'); }
  else { tasks.push({id:Date.now(),userId:currentUser.id,...data,createdAt:new Date().toISOString()}); showToast('Task created ✓','success'); }
  saveTasks(); closeModal();
  currentNav==='dashboard' ? renderDashboard() : renderTasksView(currentNav);
}

function deleteTask(id) {
  tasks=tasks.filter(t=>t.id!==id); saveTasks(); showToast('Task deleted','info');
  currentNav==='dashboard' ? renderDashboard() : renderTasksView(currentNav);
}

function toggleDone(id) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  t.status=t.status==='done'?'todo':'done'; saveTasks();
  currentNav==='dashboard' ? renderDashboard() : renderTasksView(currentNav);
}

function cycleStatus(id) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  t.status={todo:'inprogress',inprogress:'done',done:'todo'}[t.status];
  saveTasks(); showToast('Status updated','info'); renderTasksView(currentNav);
}

function setFilter(val,el) {
  activeFilter=val;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); renderTasksView(currentNav);
}

function setSearch(val) { searchQuery=val.toLowerCase(); renderTasksView(currentNav); }

function setView(v) {
  boardView=v;
  document.getElementById('vbtn-kanban').classList.toggle('active',v==='kanban');
  document.getElementById('vbtn-list').classList.toggle('active',v==='list');
  renderTasksView(currentNav);
}

function updateBadges() {
  document.getElementById('badge-tasks').textContent=tasks.filter(t=>t.status!=='done').length;
  document.getElementById('badge-inprogress').textContent=tasks.filter(t=>t.status==='inprogress').length;
}

function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('open'); }

function showToast(msg,type='info') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  setTimeout(()=>t.className='',2800);
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addSampleTasks() {
  const samples = [
    {title:'Set up Django project structure',desc:'Initialize app, configure settings and database',priority:'high',status:'done',due:''},
    {title:'Build REST API endpoints',desc:'CRUD endpoints using Django REST Framework',priority:'high',status:'inprogress',due:new Date(Date.now()+2*86400000).toISOString().split('T')[0]},
    {title:'Implement JWT authentication',desc:'Login, register, token refresh endpoints',priority:'high',status:'inprogress',due:new Date(Date.now()+3*86400000).toISOString().split('T')[0]},
    {title:'Connect frontend to Django API',desc:'Replace localStorage with real API calls',priority:'medium',status:'todo',due:new Date(Date.now()+5*86400000).toISOString().split('T')[0]},
    {title:'Add WebSocket real-time updates',desc:'Django Channels for live task sync',priority:'low',status:'todo',due:new Date(Date.now()+7*86400000).toISOString().split('T')[0]},
  ];
  tasks=samples.map((t,i)=>({...t,id:Date.now()+i,userId:currentUser.id,createdAt:new Date().toISOString()}));
  saveTasks();
}

// INIT
renderAuthFields();
if (currentUser) loginUser(currentUser);
document.getElementById('task-modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
</script>
